name: auri_sign
description: "Learn and master sign language with AI-powered real-time feedback."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.1
  flutter: ^3.32.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local Notifications
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.1

  #State Management
  flutter_bloc: ^8.1.3

  #HTTP Client
  dio: ^5.3.0

  #Comparing Dart Objects
  equatable: ^2.0.5

  #Service Locator
  get_it: ^8.1.0
  provider: ^6.1.5+1
  http: ^1.6.0
  carousel_slider: ^5.1.1
  shared_preferences: ^2.2.2

  # Camera and ML Kit
  camera: ^0.11.0+3
  image: ^4.1.0
  tflite_flutter: ^0.12.1
  
  # Permissions
  permission_handler: ^12.0.1
  image_picker: ^1.2.1

  video_player: ^2.10.1
  chewie: ^1.13.0
  webview_flutter: ^4.13.1
  flutter_screenutil: ^5.9.3
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/auri_sign_logo.png
  remove_alpha_ios: true
  adaptive_icon_background: "#F8F8F8"

flutter_native_splash:
  color: "#F8F8F8"
  image: assets/images/auri_sign_logo.png
  android_12:
    image: assets/images/auri_sign_logo.png
    color: "#F8F8F8"
  fullscreen: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # Images
  assets:
    - assets/images/logo1.png
    - assets/images/auri_sign_logo.png
    - assets/images/image1.png
    
    # TFLite Model Assets
    - assets/models/sign_model.tflite
    - assets/models/gesture_labels.txt

    # Profiling Images
    - assets/images/profiling/1st_page/book.png
    - assets/images/profiling/1st_page/briefcase.png
    - assets/images/profiling/1st_page/ear.png
    - assets/images/profiling/1st_page/family.png
    - assets/images/profiling/1st_page/hands.png
    - assets/images/profiling/1st_page/lightbulb.png
    - assets/images/profiling/1st_page/magnifying_glass.png

    - assets/images/profiling/2nd_page/house.png

    - assets/images/profiling/clock/5mins_clock.png
    - assets/images/profiling/clock/10mins_clock.png
    - assets/images/profiling/clock/15mins_clock.png
    - assets/images/profiling/clock/20mins_clock.png

    # Bottom Navigation Bar Icons
    - assets/images/bottom_navbar/home.png
    - assets/images/bottom_navbar/home_selected.png
    - assets/images/bottom_navbar/profile.png
    - assets/images/bottom_navbar/profile_selected.png
    - assets/images/bottom_navbar/dictionary.png
    - assets/images/bottom_navbar/dictionary_selected.png
    - assets/images/bottom_navbar/camera.png
    - assets/images/bottom_navbar/camera_selected.png


    # Homepage Section Images
    - assets/images/homepage_FSL_img/common_words_FSL.png
    - assets/images/homepage_FSL_img/letter_A_FSL.png
    - assets/images/homepage_FSL_img/number_1_FSL.png

    - assets/images/heart.png

  # Fonts
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_24pt-Light.ttf
          weight: 400
        - asset: assets/fonts/Inter_24pt-Bold.ttf
          weight: 700

    - family: KantumruyPro
      fonts:
        - asset: assets/fonts/KantumruyPro-VariableFont_wght.ttf
          weight: 400
    
    - family: Unna
      fonts:
        - asset: assets/fonts/Unna-Regular.ttf
          weight: 400